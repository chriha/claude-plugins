schema_version: "1.1"
name: review-cost-gate-fix-loop
description: >
  /tour:review after the cost gate answered "no optional layers", with a generated tour.json that dropped atom a5. The skill
  must keep the tour base-only (no deep/active/arch/rules fields, no spend on them) and run tour-validate, see the
  unassigned-atom error, repair it by assigning a5 and finish valid within 2 repair rounds. Guards skills/review/SKILL.md
  (steps 3 and 5) and references/writing-guide.md. Needs --scaffold, --ablation none and --allow-tools Bash Write Edit.
tags: [tour, skills, cost-gate, validate]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
  prompt: |
    You are running the /tour:review skill. Read its SKILL.md (find the plugin's `skills/review/SKILL.md` and
    `references/writing-guide.md` next to this repo's tour plugin) and follow it from step 3 on. State so far: `tour-fetch` ran
    and its output is `data/meta.json`; the cost gate was asked and the user chose NO optional layers (do not call
    AskUserQuestion, the answer is final); a draft of `tour.json` is `data/tour.json`. Do not regenerate it from scratch: run the
    skill's validation step on it with `bin/tour-validate`, repair what the validator lists, and stop after the report. Do not
    start `tour-serve`. Reply with the one-paragraph report from step 6.
graders:
  - name: a5-assigned-again
    type: regex
    target: {source: file, path: data/tour.json}
    pattern: '"a5"'
  - name: base-only-layers
    type: regex
    target: {source: file, path: data/tour.json}
    pattern: '"layers":\s*\[\s*"base"\s*\]'
  - name: no-optional-fields
    type: regex
    target: {source: file, path: data/tour.json}
    pattern: '"(graph|probes|rules_flags|callers|intent)"\s*:'
    match: not_contains
  - name: validator-run
    type: tool_used
    tool: Bash
    input_match: 'tour-validate'
    min: 1
    max: 3
    arm: both
  - name: no-serve
    type: tool_used
    tool: Bash
    input_match: 'tour-serve'
    min: 0
    max: 0
    arm: both
