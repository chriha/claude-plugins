schema_version: "1.1"
name: work-on-comments-autonomous
description: >
  /harness:work-on-comments in its default (autonomous) mode on PR 77 with two open threads: T1 is valid (shout.sh:4
  shifts once after `--times N`), T2 is invalid (it claims `times` is never set, but shout.sh:3 sets it). It must fix T1 in a
  new commit, push the branch (no force), reply to both threads with the `<!-- ai-reply -->` marker, resolve T1 only and
  leave T2 open, asking nothing. Guards skills/work-on-comments/SKILL.md. Needs --scaffold, --ablation none and
  --allow-tools Bash Write Edit.
tags: [work-on-comments, skills]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
  prompt: |
    You are running the /harness:work-on-comments skill with no flags (default autonomous mode) in this repository, on the
    checked-out branch feature/31-add-shout. Run `harness-resolve skills/work-on-comments/SKILL.md`, read it and follow it
    exactly. The forge is GitHub through the `gh` CLI, already authenticated; `origin` is reachable; <default> = main.
    You have no sub-agents and no AskUserQuestion in this run: do the verification, the fix and the check yourself, and
    skip the harvest. Do not stop to ask anything. Your final reply is the console report of the skill.
graders:
  - name: fix-committed
    type: regex
    target: {source: file, path: .harness-eval/git.log}
    pattern: '^\S+ \S+ refs/heads/feature/31-add-shout$'
    flags: m
  - name: fix-pushed
    type: regex
    target: {source: file, path: .harness-eval/origin.log}
    pattern: ' refs/heads/feature/31-add-shout$'
    flags: m
  - name: main-untouched-on-origin
    type: regex
    target: {source: file, path: .harness-eval/origin.log}
    pattern: ' refs/heads/main$'
    flags: m
    match: not_contains
  - name: no-force-push
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^;&|\n]*\bpush\b[^;&|\n]*(--force|-f\b|--force-with-lease)'
    min: 0
    max: 0
    arm: both
  - name: valid-thread-answered
    type: regex
    target: {source: file, path: .harness-eval/gh.log}
    pattern: '^api repos/\S+/pulls/77/comments/1001/replies'
    flags: m
  - name: invalid-thread-answered
    type: regex
    target: {source: file, path: .harness-eval/gh.log}
    pattern: '^api repos/\S+/pulls/77/comments/1002/replies'
    flags: m
  - name: reply-marker
    type: regex
    target: {source: file, path: .harness-eval/bodies/replies.md}
    pattern: '^<!-- ai-reply -->'
    flags: m
  - name: fixed-in-reply
    type: regex
    target: {source: file, path: .harness-eval/bodies/replies.md}
    pattern: 'Fixed in [0-9a-f]{7,}'
  - name: valid-thread-resolved
    type: regex
    target: {source: file, path: .harness-eval/gh.log}
    pattern: 'resolveReviewThread.*"?T1\b'
    flags: m
  - name: invalid-thread-left-open
    type: regex
    target: {source: file, path: .harness-eval/gh.log}
    pattern: 'resolveReviewThread.*T2'
    flags: m
    match: not_contains
  - name: report-layout
    type: llm
    criteria: |
      The reply is a console report: a header `━━ /harness:work-on-comments · … ━━`, then sections among VERDICT, NEEDS YOU,
      DONE, NO ACTION. Pass if the valid comment (shout.sh:4) is listed as fixed/DONE and the invalid one (shout.sh:3) is
      listed as answered with its thread still open (NEEDS YOU or NO ACTION), and the report does not ask the human for approval
      or a choice.
